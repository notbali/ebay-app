<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script src="theme.js"></script>
<script>Theme.initTheme(window);</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="What's New at The Bali Bay — product updates to our AI-assisted eBay listing tool." />
<title>What's New — The Bali Bay</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="legal-page">
  <header class="site-header">
    <div class="site-header-inner">
      <div class="wordmark">
        <a href="/" id="brand-link" class="brand-link" aria-label="The Bali Bay — home">
          <span class="kicker">THE</span>
          <span class="brand-row">
            <h1>Bali Bay</h1>
            <span class="beta-badge">Beta</span>
          </span>
        </a>
      </div>
      <p>News</p>
    </div>
  </header>

  <main>
    <section>
      <h2>News</h2>
      <p class="effective-date">Product updates, posted as they ship.</p>

      <div id="updates-list" class="updates-list-page">
        <p class="muted">Loading&hellip;</p>
      </div>

      <div id="new-update-panel" hidden>
        <h3>Post an update</h3>
        <form id="new-update-form">
          <label>Title<input type="text" name="title" required /></label>
          <label>Details<textarea name="body" rows="4" required></textarea></label>
          <button type="submit">Post update</button>
          <div id="new-update-status" class="error" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-links">
      <a href="/">Back to The Bali Bay</a>
      <a href="/terms.html">Terms of Service</a>
      <a href="/privacy.html">Privacy Policy</a>
    </div>
    <div id="feedback-widget" class="feedback-widget"></div>
  </footer>

  <script src="brand-nav.js"></script>
  <script src="update-format.js"></script>
  <script src="updates.js"></script>
  <script src="feedback-widget.js"></script>
</body>
</html>
