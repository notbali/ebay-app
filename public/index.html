<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Industrial Parts Listing Assistant</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Listing Assistant</h1>
    <p>Upload a part → Claude drafts the listing → you review → publish live to eBay.</p>
  </header>

  <main>
    <section id="upload-section">
      <h2>New Part</h2>
      <form id="upload-form">
        <label>
          Photos (up to 12)
          <div id="photo-dropzone" class="dropzone">
            <p>Drag &amp; drop photos here, or click to browse</p>
            <input type="file" id="photo-input" name="photos" accept="image/*" multiple hidden />
          </div>
          <div id="photo-preview" class="photo-preview"></div>
        </label>
        <label>
          Notes / part number / spec sheet text (optional but helps accuracy)
          <textarea id="notes-input" name="notes" rows="4" placeholder="e.g. Omron relay, pulled from line 3, model illegible on label but 24VDC coil, 8-pin"></textarea>
        </label>
        <button type="submit">Generate Listing</button>
      </form>
      <div id="upload-status"></div>
    </section>

    <section id="drafts-section">
      <h2>Drafts</h2>
      <div id="drafts-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
